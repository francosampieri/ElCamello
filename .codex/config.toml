# Configuración del proyecto. Context7 sigue heredándose de la configuración global.
[mcp_servers.astro-docs]
url = "https://mcp.docs.astro.build/mcp"
enabled = true
required = false
startup_timeout_sec = 30

[mcp_servers.stitch]
url = "https://stitch.googleapis.com/mcp"
# La credencial se lee del entorno; no guardar su valor aquí.
env_http_headers = { "X-Goog-Api-Key" = "STITCH_API_KEY" }
enabled = true
required = false
startup_timeout_sec = 30

[mcp_servers.chrome-devtools]
command = "node"
args = [".codex/chrome-devtools.mjs"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
